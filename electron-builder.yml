# electron-builder.yml
# Production build config for Print & Scan Service
# Generates: Windows .exe (NSIS), Linux .deb + .AppImage, macOS .dmg

appId: com.antiersolutions.printscansvc
productName: "Print & Scan Service"
copyright: "Copyright © 2026 Antier Solutions"

# ─── Output directory ─────────────────────────────────────────────────────────
# Entry point comes from package.json's "main" field (electron/main.js) —
# electron-builder has no top-level "main" key of its own.
directories:
  output: dist/
  buildResources: build/  # icons go here: icon.icns, icon.ico, icon.png

# ─── Files to include in the packaged app ─────────────────────────────────────
files:
  - "index.js"
  - "electron/**/*"
  - "shared/**/*"
  - "src/**/*"
  - "package.json"
  - ".env"
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/__tests__/**"

# ─── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis        # produces single-file .exe installer
      arch: [x64]
  icon: build/icon.ico
  # Request admin on install (needed to write to Program Files)
  # The Electron app itself does NOT need admin at runtime — NAPS2 bundled portable.
  requestedExecutionLevel: asInvoker
  # NAPS2 portable — DependencyManager.js reads this from resourcesPath at
  # runtime. Per-platform extraResources must live under win:/linux:/mac:,
  # not at the top level (a shared "platform:" filter isn't part of the
  # schema). Chromium is bundled the same way on every platform — run
  # `node scripts/stage-chromium.js` on this OS before building (see
  # printService.js's getBundledChromiumPath()).
  extraResources:
    - from: "resources/naps2/"
      to: "naps2/"
      filter:
        - "**/*"
    - from: "resources/chromium/win32/"
      to: "chromium/win32/"
      filter:
        - "**/*"

nsis:
  oneClick: true            # silent install — teacher just double-clicks .exe
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Print & Scan Service"
  # Auto-start tray app after install
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

# ─── Linux ────────────────────────────────────────────────────────────────────
linux:
  target:
    - target: deb        # preferred — handles deps automatically
    - target: AppImage   # fallback for non-Debian distros
  icon: build/icons/     # folder with 16x16 through 512x512 PNGs
  category: Utility
  maintainer: "Antier Solutions <support@antiersolutions.com>"
  synopsis: "Silent print and scan service for local network"
  description: |
    A local HTTP service (port 4545) that enables websites to silently print
    to any printer and scan from any scanner without browser print dialogs.
  extraResources:
    - from: "resources/chromium/linux/"
      to: "chromium/linux/"
      filter:
        - "**/*"

deb:
  # apt will auto-install these when teacher installs the .deb
  # Zero terminal access needed — Software Center handles everything
  depends:
    - sane-utils       # provides scanimage command
    - sane-airscan     # WiFi/network scanner support (Canon, HP, Epson, etc.)
    - cups             # printer spooler (lp command) — usually pre-installed
    - libnotify4       # system tray notifications

# ─── macOS ────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [x64, arm64]   # Intel + Apple Silicon universal
  icon: build/icon.icns
  category: public.app-category.utilities
  # Minimum macOS version
  minimumSystemVersion: "11.0"
  # Hardened runtime required for notarization
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Bundled scanimage binary — fallback if Homebrew isn't present. See win:'s
  # extraResources comment above for why this lives under mac:, not top-level.
  #
  # NOTE — universal build caveat: mac.target above builds both x64 and
  # arm64 in one pass, but resources/chromium/darwin/ can only hold ONE
  # arch's Chromium (whichever this build machine's `npm install` fetched).
  # A true universal build needs a CI matrix that stages each arch's
  # Chromium into its own arch-specific resource folder — out of scope here.
  extraResources:
    - from: "resources/bin/"
      to: "bin/"
      filter:
        - "scanimage"
        - "*.dylib"
    - from: "resources/chromium/darwin/"
      to: "chromium/darwin/"
      filter:
        - "**/*"

dmg:
  title: "Print & Scan Service"
  background: build/dmg-background.png
  icon: build/icon.icns
  iconSize: 80
  window:
    width:  540
    height: 380
  contents:
    - x: 135
      y: 185
      type: file
    - x: 405
      y: 185
      type: link
      path: /Applications

# ─── Auto-update (optional — configure if you have an update server) ──────────
# publish:
#   provider: generic
#   url: https://your-update-server.com/updates/

# ─── Hooks ────────────────────────────────────────────────────────────────────
# afterPack: electron/scripts/afterPack.js   # optional post-pack hook
